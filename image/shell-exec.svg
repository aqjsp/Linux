<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="300" rx="12" fill="#fafafa"/>
  <rect width="880" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">三种执行方式：子 Shell vs source</text>

  <rect x="40" y="60" width="250" height="180" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="165" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">bash script.sh</text>
  <text x="165" y="124" text-anchor="middle" font-size="12" fill="#0d47a1">新开子 Shell</text>
  <text x="165" y="148" text-anchor="middle" font-size="12" fill="#0d47a1">不需要 +x</text>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="#1565c0">环境变量改完就丢</text>
  <text x="165" y="208" text-anchor="middle" font-size="11" fill="#546e7a">shebang 被忽略（用的是 bash）</text>

  <rect x="315" y="60" width="250" height="180" rx="10" fill="#fff3e0" stroke="#e65100"/>
  <text x="440" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">./script.sh</text>
  <text x="440" y="124" text-anchor="middle" font-size="12" fill="#bf360c">内核读 #! 选解释器</text>
  <text x="440" y="148" text-anchor="middle" font-size="12" fill="#bf360c">必须有执行位</text>
  <text x="440" y="180" text-anchor="middle" font-size="12" fill="#e65100">仍是子进程</text>
  <text x="440" y="208" text-anchor="middle" font-size="11" fill="#546e7a">export 出不去当前终端</text>

  <rect x="590" y="60" width="250" height="180" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="715" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">source script.sh</text>
  <text x="715" y="124" text-anchor="middle" font-size="12" fill="#1b5e20">当前 Shell 里跑</text>
  <text x="715" y="148" text-anchor="middle" font-size="12" fill="#1b5e20">. script.sh 同义</text>
  <text x="715" y="180" text-anchor="middle" font-size="12" fill="#2e7d32">cd / export 会留下</text>
  <text x="715" y="208" text-anchor="middle" font-size="11" fill="#546e7a">改 profile 后要 source</text>
  <text x="440" y="272" text-anchor="middle" font-size="12" fill="#78909c">$* 是「所有参数当一串」；$@ 是「每个参数分开」。加双引号时差别才明显</text>

</svg>
