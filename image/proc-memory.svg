<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="280" rx="12" fill="#fafafa"/>
  <rect width="880" height="280" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">看现场：ps / top / free / ss</text>

  <rect x="30" y="60" width="190" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">进程</text>
  <text x="125" y="122" text-anchor="middle" font-size="12" fill="#0d47a1">ps aux / ps -ef</text>
  <text x="125" y="146" text-anchor="middle" font-size="12" fill="#0d47a1">top / htop</text>
  <text x="125" y="170" text-anchor="middle" font-size="12" fill="#0d47a1">kill -15 再 -9</text>
  <text x="125" y="198" text-anchor="middle" font-size="11" fill="#546e7a">STAT: R S D Z T</text>

  <rect x="240" y="60" width="190" height="160" rx="10" fill="#fff3e0" stroke="#e65100"/>
  <text x="335" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">内存</text>
  <text x="335" y="122" text-anchor="middle" font-size="12" fill="#bf360c">free -h</text>
  <text x="335" y="146" text-anchor="middle" font-size="12" fill="#bf360c">available ≠ free</text>
  <text x="335" y="170" text-anchor="middle" font-size="12" fill="#bf360c">buff/cache 可回收</text>
  <text x="335" y="198" text-anchor="middle" font-size="11" fill="#546e7a">OOM 看 dmesg</text>

  <rect x="450" y="60" width="190" height="160" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="545" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">磁盘</text>
  <text x="545" y="122" text-anchor="middle" font-size="12" fill="#1b5e20">df -h 文件系统</text>
  <text x="545" y="146" text-anchor="middle" font-size="12" fill="#1b5e20">du -sh 目录占用</text>
  <text x="545" y="170" text-anchor="middle" font-size="12" fill="#1b5e20">inode 用 df -i</text>
  <text x="545" y="198" text-anchor="middle" font-size="11" fill="#546e7a">满了不一定是容量</text>

  <rect x="660" y="60" width="190" height="160" rx="10" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="755" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">网络</text>
  <text x="755" y="122" text-anchor="middle" font-size="12" fill="#4a148c">ss -lntp 听端口</text>
  <text x="755" y="146" text-anchor="middle" font-size="12" fill="#4a148c">ss -antp 连接</text>
  <text x="755" y="170" text-anchor="middle" font-size="12" fill="#4a148c">ip addr / ip route</text>
  <text x="755" y="198" text-anchor="middle" font-size="11" fill="#546e7a">netstat 已过时</text>
  <text x="440" y="250" text-anchor="middle" font-size="12" fill="#78909c">ifconfig 在不少发行版默认不装；用 ip。service 在 systemd 上用 systemctl</text>

</svg>
